name: Expose source tree

on:
  push:
    branches: [main]
    paths:
      - 'HealthThread Memory-2.zip'
      - '.github/workflows/extract-source.yml'
      - 'scripts/extract_source.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: healththread-source-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract source safely
        run: python scripts/extract_source.py

      - name: Verify visible project manifest
        shell: bash
        run: |
          test -f package.json || test -f pyproject.toml || test -f requirements.txt
          test ! -f 'HealthThread Memory-2.zip'
          git diff --check
          git status --short

      - name: Commit extracted source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No extraction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Expose HealthThread source tree'
          git push origin HEAD:main
