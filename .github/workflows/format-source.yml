name: Format extracted source

on:
  push:
    branches: [chore/health-event-ci-harness]
    paths:
      - '.github/workflows/format-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: healththread-source-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: chore/health-event-ci-harness

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format approved text surfaces
        shell: bash
        run: |
          npx prettier --write \
            'src/**/*.{ts,tsx}' \
            'test/**/*.ts' \
            'scripts/**/*.mjs' \
            'README.md' \
            'CONTRIBUTING.md' \
            '.github/**/*.yml' \
            '.github/**/*.md' \
            'eslint.config.js' \
            'vite.config.ts' \
            'tsconfig.json' \
            'components.json' \
            'package.json' \
            '.prettierrc'

      - name: Verify formatting scope
        shell: bash
        run: |
          test -z "$(git diff --name-only -- package-lock.json bun.lock)"
          git diff --check
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              src/*.ts|src/*.tsx|src/*/*.ts|src/*/*.tsx|src/*/*/*.ts|src/*/*/*.tsx|src/*/*/*/*.ts|src/*/*/*/*.tsx|test/*.ts|test/*/*.ts|scripts/*.mjs|scripts/*/*.mjs|README.md|CONTRIBUTING.md|.github/*.yml|.github/*/*.yml|.github/*.md|.github/*/*.md|eslint.config.js|vite.config.ts|tsconfig.json|components.json|package.json|.prettierrc) ;;
              *) echo "Unexpected formatted path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Format extracted HealthThread source'
          git push origin HEAD:chore/health-event-ci-harness
