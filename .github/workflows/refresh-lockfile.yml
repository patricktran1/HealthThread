name: Refresh imported lockfile

on:
  push:
    branches: [chore/health-event-ci-harness]
    paths:
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: healththread-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: chore/health-event-ci-harness

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --no-audit --no-fund

      - name: Verify scope and commit lockfile
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = 'package-lock.json'
          git diff --check -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Repair imported npm lockfile'
          git push origin HEAD:chore/health-event-ci-harness
